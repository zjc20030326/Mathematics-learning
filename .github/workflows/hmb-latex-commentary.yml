name: Validate HMB LaTeX Commentary
on:
  push:
    branches: [hmb-latex-commentary-review]
    paths:
      - '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/**/*.tex'
      - '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/hmb-explanation.tex'
      - '.github/workflows/hmb-latex-commentary.yml'
permissions:
  contents: write
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile complete LaTeX commentary with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: hmb-explanation.tex
          working_directory: '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation'
          latexmk_use_xelatex: true
          args: '-pdf -xelatex -interaction=nonstopmode -halt-on-error -file-line-error'
      - name: Validate compiled PDF
        run: |
          f='可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/hmb-explanation.pdf'
          test -s "$f"
          file "$f"
          if command -v pdfinfo >/dev/null 2>&1; then pdfinfo "$f" | grep -E 'Pages:|Page size:|File size:'; fi
      - name: Save PDF and complete LaTeX sources for page inspection
        uses: actions/upload-artifact@v4
        with:
          name: hmb-latex-commentary
          path: |
            可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/hmb-explanation.pdf
            可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/hmb-explanation.tex
            可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/chapters/*.tex
          if-no-files-found: error
      - name: Commit compiled PDF on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/hmb-explanation.pdf'
          if ! git diff --cached --quiet; then
            git commit -m 'Build reviewed HMB full commentary PDF'
            git push origin HEAD:hmb-latex-commentary-review
          fi
