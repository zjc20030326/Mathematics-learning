name: Validate HMB LaTeX Commentary
on:
  push:
    branches: [hmb-latex-commentary-review]
    paths:
      - '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/**'
      - '.github/workflows/hmb-latex-commentary.yml'
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile complete LaTeX commentary with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: hmb-explanation.tex
          working_directory: '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation'
          latexmk_use_xelatex: true
          args: '-pdf -xelatex -interaction=nonstopmode -halt-on-error -file-line-error'
      - name: Save PDF for page inspection
        uses: actions/upload-artifact@v4
        with:
          name: hmb-latex-commentary
          path: '可积系统Riemann-Hilbert 方法/Hirota–Maxwell–Bloch方程/hmb-nzbc-thesis-explanation/hmb-explanation.pdf'
          if-no-files-found: error
